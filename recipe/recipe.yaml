schema_version: 1

context:
  version: "2.0.2"

package:
  name: pystac-ext-storage
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pystac-ext-storage/pystac_ext_storage-${{ version }}.tar.gz
  sha256: a55224c3f9eebb441f8c6a999033b47a34ba211b8f2ee806132525047ece5547

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - pystac-core

tests:
  - python:
      imports:
        - pystac.extensions.storage
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Storage extension for PySTAC
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://pypi.org/project/pystac-ext-storage/
  documentation: https://pystac.readthedocs.io

extra:
  recipe-maintainers:
    - ocefpaf
